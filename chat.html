<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Chat Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
        .message-appear { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-[#212121] text-slate-200 h-screen flex overflow-hidden font-sans">

    <!-- Sidebar (Histórico) -->
    <aside class="w-64 bg-[#171717] h-full flex-col hidden md:flex border-r border-white/10">
        <div class="p-4">
            <button onclick="newChat()" class="w-full border border-white/20 hover:bg-white/10 transition rounded-lg p-3 text-sm flex items-center gap-3 transition-all">
                <i class="fas fa-plus"></i> Nova Conversa
            </button>
        </div>
        <div id="chat-history" class="flex-1 overflow-y-auto custom-scrollbar p-2 space-y-2">
            <!-- Histórico de conversas aqui -->
        </div>
        <div class="p-4 border-t border-white/10 text-xs text-slate-500 text-center">
            Claude Interface v1.0
        </div>
    </aside>

    <!-- Área do Chat -->
    <main class="flex-1 flex flex-col h-full relative">

        <!-- Header -->
        <header class="p-4 border-b border-white/10 flex justify-between items-center bg-[#212121]/80 backdrop-blur-md sticky top-0 z-10">
            <div class="flex items-center gap-2">
                <span class="font-semibold text-lg">Claude Chat</span>
                <span class="text-xs bg-green-500/20 text-green-400 px-2 py-0.5 rounded-full border border-green-500/30">Online</span>
            </div>
            <button onclick="clearChat()" class="text-slate-400 hover:text-white transition text-sm">
                <i class="fas fa-trash-alt"></i> Limpar
            </button>
        </header>

        <!-- Mensagens -->
        <div id="chat-window" class="flex-1 overflow-y-auto custom-scrollbar p-4 md:p-8 space-y-6">
            <!-- Boas vindas -->
            <div class="max-w-3xl mx-auto text-center my-12 space-y-4">
                <div class="w-16 h-16 bg-blue-600 rounded-full flex items-center justify-center mx-auto text-3xl shadow-xl">
                    <i class="fas fa-robot text-white"></i>
                </div>
                <h2 class="text-2xl font-bold">Como posso ajudar você hoje?</h2>
                <p class="text-slate-400">Digite sua mensagem abaixo e eu a prepararei para o terminal do Claude.</p>
            </div>
        </div>

        <!-- Input Area -->
        <div class="p-4 md:p-8 bg-gradient-to-t from-[#212121] via-[#212121] to-transparent">
            <div class="max-w-3xl mx-auto relative">
                <div class="bg-[#2f2f2f] rounded-2xl border border-white/10 shadow-2xl focus-within:border-blue-500/50 transition-all">
                    <textarea id="user-input"
                        class="w-full bg-transparent p-4 pr-16 outline-none resize-none text-slate-200 placeholder-slate-500 custom-scrollbar"
                        rows="1"
                        placeholder="Envie uma mensagem..."
                        oninput="this.style.height = '';this.style.height = this.scrollHeight + 'px'"></textarea>

                    <button onclick="sendMessage()"
                        class="absolute right-3 bottom-3 w-10 h-10 bg-white text-black rounded-xl hover:bg-slate-200 transition-all flex items-center justify-center shadow-lg active:scale-90">
                        <i class="fas fa-arrow-up"></i>
                    </button>
                </div>
                <p class="text-[10px] text-center text-slate-500 mt-3">
                    Lembre-se: Copie a mensagem gerada e cole no terminal do Claude Code.
                </p>
            </div>
        </div>
    </main>

    <script>
        const chatWindow = document.getElementById('chat-window');
        const userInput = document.getElementById('user-input');

        function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // Adiciona mensagem do usuário
            appendMessage('user', text);
            userInput.value = '';
            userInput.style.height = 'auto';

            // Simula "está digitando"
            const typingId = showTyping();

            setTimeout(() => {
                removeTyping(typingId);
                // Resposta do sistema
                appendMessage('claude', `Mensagem capturada! 🚀\n\nCopiando para o terminal...`, true);

                // Copia para o clipboard
                navigator.clipboard.writeText(text).then(() => {
                    console.log('Copiado!');
                });
            }, 1000);
        }

        function appendMessage(sender, text, isSystem = false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `flex ${sender === 'user' ? 'justify-end' : 'justify-start'} message-appear`;

            const content = sender === 'user'
                ? `<div class="bg-blue-600 text-white p-3 rounded-2xl rounded-tr-none max-w-[80%] shadow-md">${text}</div>`
                : `<div class="flex gap-3 max-w-[80%]">
                    <div class="w-8 h-8 bg-slate-700 rounded-full flex items-center justify-center flex-shrink-0 mt-1">
                        <i class="fas fa-robot text-xs"></i>
                    </div>
                    <div class="bg-[#2f2f2f] text-slate-200 p-3 rounded-2xl rounded-tl-none shadow-md border border-white/5">${text}</div>
                   </div>`;

            msgDiv.innerHTML = content;
            chatWindow.appendChild(msgDiv);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function showTyping() {
            const id = 'typing-' + Date.now();
            const typingDiv = document.createElement('div');
            typingDiv.id = id;
            typingDiv.className = 'flex justify-start message-appear';
            typingDiv.innerHTML = `
                <div class="flex gap-3 max-w-[80%]">
                    <div class="w-8 h-8 bg-slate-700 rounded-full flex items-center justify-center flex-shrink-0 mt-1">
                        <i class="fas fa-robot text-xs"></i>
                    </div>
                    <div class="bg-[#2f2f2f] p-3 rounded-2xl rounded-tl-none flex gap-1 items-center">
                        <span class="w-1.5 h-1.5 bg-slate-500 rounded-full animate-bounce"></span>
                        <span class="w-1.5 h-1.5 bg-slate-500 rounded-full animate-bounce [animation-delay:0.2s]"></span>
                        <span class="w-1.5 h-1.5 bg-slate-500 rounded-full animate-bounce [animation-delay:0.4s]"></span>
                    </div>
                </div>`;
            chatWindow.appendChild(typingDiv);
            chatWindow.scrollTop = chatWindow.scrollHeight;
            return id;
        }

        function removeTyping(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function clearChat() {
            chatWindow.innerHTML = '';
            appendMessage('claude', 'Chat limpo! Como posso ajudar agora?');
        }

        function newChat() {
            clearChat();
        }

        // Enviar com Enter (Shift+Enter pula linha)
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
